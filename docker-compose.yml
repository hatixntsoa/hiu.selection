services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET:-change-me}
      FRONTEND_URL: http://localhost:3000
      DB_PATH: /app/data/ctf.db
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
